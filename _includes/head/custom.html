<style>
  .about-hero {
    display: flex;
    align-items: flex-start;
    gap: 1.25em;
    margin: 0 0 1.5em;
  }
  .about-hero__photo-wrap {
    flex: 0 0 auto;
    display: flex;
  }
  .about-hero__photo {
    width: auto;
    height: auto;
    max-height: 66.666%;
    object-fit: contain !important;
    object-position: top left;
    border-radius: 0 !important;
  }
  .about-hero__text {
    flex: 1;
    min-width: 0;
  }
  .about-hero__text p:first-child {
    margin-top: 0;
  }
  .about-hero__text p:last-child {
    margin-bottom: 0;
  }
  @media (max-width: 768px) {
    .about-hero {
      flex-direction: column;
      align-items: flex-start;
    }
    .about-hero__photo-wrap {
      width: 46%;
      max-width: 186px;
    }
    .about-hero__photo {
      width: 100%;
      height: auto;
      max-height: none;
    }
  }
</style>

<script>
  (function () {
    function syncAboutPhoto() {
      var photo = document.querySelector(".about-hero__photo");
      var text = document.querySelector(".about-hero__text");
      if (!photo || !text) return;
      if (window.innerWidth <= 768) {
        photo.style.height = "";
        photo.style.width = "";
        return;
      }
      photo.style.width = "auto";
      photo.style.height = Math.round(text.offsetHeight * 2 / 3) + "px";
    }
    window.addEventListener("load", syncAboutPhoto);
    window.addEventListener("resize", syncAboutPhoto);
  })();
</script>
